# Single public origin: serve the SPA and reverse-proxy the API under /api.
# This keeps frontend and backend same-origin (no CORS, SameSite=Lax cookies).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow image uploads (product/category/profile images) through the proxy.
  client_max_body_size 15m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    application/xml;

  # Efficient static file delivery (uploads + SPA bundle).
  sendfile on;
  tcp_nopush on;

  # Hashed build assets can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Uploaded images are served straight off the shared volume, so a Node worker
  # is never occupied streaming a static file. This location is matched before
  # the `/api/` proxy below because nginx prefers the longest prefix match.
  #
  # Filenames are server-generated UUIDs and are never reused, so responses are
  # safe to cache indefinitely.
  location /api/uploads/ {
    alias /var/www/uploads/;

    try_files $uri =404;

    # Content types are pinned rather than sniffed: these are user-supplied
    # files, and they must never be interpreted as an active document.
    types {
      image/jpeg jpg jpeg;
      image/png  png;
      image/webp webp;
      image/gif  gif;
    }
    default_type application/octet-stream;

    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Disposition "inline" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    access_log off;
  }

  # Everything else under /api goes to the backend. The trailing slash on
  # proxy_pass strips the `/api` prefix, so the backend keeps its existing
  # (un-prefixed) routes:
  #   /api/auth/login                 -> backend /auth/login
  #   /api/products/images (upload)   -> backend /products/images
  #   /api/notifications/stream (SSE) -> backend /notifications/stream
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events (notifications / contact message streams) must stay
    # unbuffered and long-lived.
    proxy_set_header Connection        '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # SPA client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
