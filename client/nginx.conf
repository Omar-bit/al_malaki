# Single public origin: serve the SPA and reverse-proxy the API under /api.
# This keeps frontend and backend same-origin (no CORS, SameSite=Lax cookies).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow image uploads (product/category/profile images) through the proxy.
  client_max_body_size 15m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    image/svg+xml
    application/xml;

  # Hashed build assets can be cached aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API + backend-served uploads. The trailing slash on proxy_pass strips the
  # `/api` prefix, so the backend keeps its existing (un-prefixed) routes:
  #   /api/auth/login          -> backend /auth/login
  #   /api/uploads/products/x  -> backend /uploads/products/x
  #   /api/notifications/stream (SSE) -> backend /notifications/stream
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events (notifications / contact message streams) must stay
    # unbuffered and long-lived.
    proxy_set_header Connection        '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # SPA client-side routing fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
